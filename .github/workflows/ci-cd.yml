name: Build, Push, and Deploy Docker Image

on:
  push:
    branches:
      - Master

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
  IMAGE_NAME: periicles/gestion-produits-php
  KUBECONFIG: ${{ secrets.KUBECONFIG }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build image
      id: build
      uses: docker/build-push-action@v4
      with:
        context: php
        file: php/Dockerfile
        push: false
        tags: ${{ env.IMAGE_NAME }}:latest

  push:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ env.DOCKERHUB_USERNAME }}
        password: ${{ env.DOCKERHUB_PASSWORD }}

    - name: Push image
      uses: docker/build-push-action@v4
      with:
        push: true
        tags: ${{ env.IMAGE_NAME }}:latest
        context: Renforcement-D-veloppement-Web/php
        file: Renforcement-D-veloppement-Web/php/Dockerfile

  deploy:
    needs: push
    runs-on: ubuntu-latest

    steps:
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Setup Kubeconfig
      run: echo "${{ env.KUBECONFIG }}" | base64 --decode > $HOME/.kube/config

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f persistent-volumes.yml
        kubectl apply -f deployment.yml
        kubectl apply -f service.yml
        kubectl rollout status deployment/your-deployment-name
